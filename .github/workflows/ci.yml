name: Space247 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-ci:
    name: Backend CI (Python / Alembic / Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: real_estate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/real_estate_db
      REDIS_URL: redis://localhost:6379/0
      VECTOR_DIM: 768
      SECRET_KEY: space247-test-super-secret-jwt-key-for-ci-pipeline-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache FastEmbed & HuggingFace Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: ${{ runner.os }}-models-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          uv sync --frozen --group dev

      - name: Install PostGIS in Postgres container
        run: |
          docker exec ${{ job.services.postgres.id }} apt-get update
          docker exec ${{ job.services.postgres.id }} apt-get install -y --no-install-recommends postgresql-16-postgis-3 postgresql-16-postgis-3-scripts

      - name: Run Database Migrations (Alembic)
        working-directory: backend
        run: |
          uv run alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          uv run pytest -v --durations=10

  frontend-ci:
    name: Frontend CI (Node.js / Type Check / Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/web
        run: |
          npm ci

      - name: Run TypeScript Type Check
        working-directory: frontend/web
        run: |
          npx tsc --noEmit

      - name: Run Next.js Production Build
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: |
          npm run build
